<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | SecuraLabs</title>
    <link rel="icon" type="image/png" href="img/Secura Logoicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        securaPurple: '#875cb6',
                        securaCoral: '#F19C7C',
                        securaDark: '#1f2937',
                        securaLight: '#f9fafb'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script>
        try {
            const urlParams = new URLSearchParams(window.location.search);
            let theme = urlParams.get('theme');
            
            if (!theme) {
                theme = localStorage.getItem('theme');
            } else {
                try { localStorage.setItem('theme', theme); } catch(e) {}
            }
            
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        } catch(e) {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
        }
    </script>
    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #1f2937;
        }

    </style>
</head>

<body class="bg-white dark:bg-gray-900 antialiased overflow-x-hidden transition-colors duration-300">

    

    <div id="site-header"></div>
    <div id="cart-root"></div>



    <section id="contact" class="pt-32 pb-20 min-h-[calc(100vh-200px)] flex flex-col justify-center transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-16">
                <div>
                    <p class="eyebrow mb-4">Contact</p>
                    <h1 class="text-4xl md:text-5xl font-bold text-securaDark dark:text-white mb-6">Talk to SecuraLabs.</h1>
                    <p class="text-gray-600 dark:text-gray-300 mb-8">Whether you have a question about your order, or you're a venue
                        operator interested in implementing Ki-Liner at scale, our team is here to help.</p>

                    <div class="space-y-6">
                        <div class="flex items-start">
                            <div class="bg-white dark:bg-gray-800 p-3 rounded-lg shadow-sm text-securaPurple mr-4">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-map-pin"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 15.007 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
                            </div>
                            <div>
                                <h4 class="font-semibold text-securaDark dark:text-white">Headquarters</h4>
                                <p class="text-gray-500 dark:text-gray-400">S&atilde;o Paulo, Brazil</p>
                            </div>
                        </div>
                        <div class="flex items-start">
                            <div class="bg-white dark:bg-gray-800 p-3 rounded-lg shadow-sm text-securaPurple mr-4">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mail"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                            </div>
                            <div>
                                <h4 class="font-semibold text-securaDark dark:text-white">Email Support</h4>
                                <p class="text-gray-500 dark:text-gray-400">support@securalabs.com</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="premium-card rounded-3xl p-8">
                    <form id="contact-form">
                        <div class="mb-4">
                            <label for="contact-name" class="block text-gray-700 dark:text-gray-300 font-medium mb-2">Name</label>
                            <input type="text" id="contact-name" name="name" autocomplete="name" required
                                class="form-control text-base w-full px-4 py-3 border border-gray-300 dark:border-gray-600 focus:outline-none focus:border-securaPurple focus:ring-2 focus:ring-offset-2 dark:focus:ring-offset-gray-800 focus:ring-securaPurple bg-white dark:bg-gray-700 dark:text-white"
                                placeholder="Your Name">
                        </div>
                        <div class="mb-4">
                            <label for="contact-email" class="block text-gray-700 dark:text-gray-300 font-medium mb-2">Email Address</label>
                            <input type="email" id="contact-email" name="email" autocomplete="email" required
                                class="form-control text-base w-full px-4 py-3 border border-gray-300 dark:border-gray-600 focus:outline-none focus:border-securaPurple focus:ring-2 focus:ring-offset-2 dark:focus:ring-offset-gray-800 focus:ring-securaPurple bg-white dark:bg-gray-700 dark:text-white"
                                placeholder="you@company.com">
                        </div>
                        <div class="mb-4">
                            <label for="contact-inquiry" class="block text-gray-700 dark:text-gray-300 font-medium mb-2">Inquiry Type</label>
                            <select id="contact-inquiry" name="inquiry"
                                class="form-control text-base w-full px-4 py-3 border border-gray-300 dark:border-gray-600 focus:outline-none focus:border-securaPurple focus:ring-2 focus:ring-offset-2 dark:focus:ring-offset-gray-800 focus:ring-securaPurple bg-white dark:bg-gray-700 dark:text-white appearance-none cursor-pointer">
                                <option>General Inquiry</option>
                                <option>Retail Support</option>
                                <option>B2B & Venue Partnership</option>
                            </select>
                        </div>
                        <div class="mb-6">
                            <label for="contact-message" class="block text-gray-700 dark:text-gray-300 font-medium mb-2">Message</label>
                            <textarea id="contact-message" name="message" rows="4"
                                class="form-control text-base w-full px-4 py-3 border border-gray-300 dark:border-gray-600 focus:outline-none focus:border-securaPurple focus:ring-2 focus:ring-offset-2 dark:focus:ring-offset-gray-800 focus:ring-securaPurple bg-white dark:bg-gray-700 dark:text-white resize-y"
                                placeholder="How can we help?"></textarea>
                        </div>
                        <button type="submit" id="contact-submit-btn" class="btn-primary w-full relative">
                            <span class="btn-text">Send Message</span>
                            <svg class="btn-spinner hidden animate-spin absolute w-5 h-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </button>
                    </form>
                    <div id="contact-success-message"
                        class="hidden text-securaPurple font-semibold bg-purple-50 dark:bg-gray-700 p-6 rounded-lg border border-purple-100 dark:border-gray-600 text-center"
                        role="alert" aria-live="polite" tabindex="-1">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="site-footer"></div>

    <script src="layout.js"></script>
    <script src="main.js"></script>
</body>

</html>
